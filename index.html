<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luogu短时比赛工程—简介</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #0a0e17;
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* 粒子背景 */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid rgba(0, 150, 255, 0.2);
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        
        .nav-links {
            display: flex;
            gap: 40px;
        }
        
        .nav-links a {
            color: #b0b0b0;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-links a:hover {
            color: #00c6ff;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        /* 主内容区 */
        .hero {
            display: flex;
            align-items: center;
            min-height: 80vh;
            padding: 60px 0;
        }
        
        .hero-content {
            flex: 1;
            padding-right: 40px;
        }
        
        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00c6ff, #0072ff, #6a11cb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 5s infinite alternate;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        
        .hero-subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 30px;
            line-height: 1.6;
            max-width: 600px;
        }
        
        .cta-button {
            display: inline-block;
            padding: 15px 35px;
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
        }
        
        .cta-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s ease;
        }
        
        .cta-button:hover::after {
            left: 100%;
        }
        
        .hero-visual {
            flex: 1;
            position: relative;
            height: 400px;
        }
        
        .floating-element {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 114, 255, 0.1) 0%, rgba(0, 114, 255, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -55%) scale(1.05); }
        }
        
        .floating-element::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #00c6ff, transparent);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 特性展示区 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 80px 0;
        }
        
        .feature-card {
            background: rgba(20, 25, 40, 0.7);
            border-radius: 15px;
            padding: 30px;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 150, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .feature-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 150, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.1);
        }
        
        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00c6ff;
        }
        
        .feature-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #ffffff;
        }
        
        .feature-desc {
            color: #a0a0a0;
            line-height: 1.6;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 60px;
            border-top: 1px solid rgba(0, 150, 255, 0.2);
            color: #888;
            font-size: 0.9rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }
            
            .hero-content {
                padding-right: 0;
                margin-bottom: 50px;
            }
            
            .hero-title {
                font-size: 2.8rem;
            }
        }
        
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .hero-title {
                font-size: 2.2rem;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
        
        /* 数据流效果 */
        .data-stream {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }
        
        .stream-line {
            position: absolute;
            width: 1px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, #00c6ff, transparent);
            animation: streamFlow 3s linear infinite;
        }
        
        @keyframes streamFlow {
            0% { transform: translateY(-100px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles-js"></div>
    
    <!-- 数据流效果 -->
    <div class="data-stream" id="dataStream"></div>
    
    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="logo">NEXUS<span style="color: #00c6ff;">.</span>TECH</div>
            <div class="nav-links">
                <a href="#home">跳转至服务页</a>
                <a href="#about">关于</a>
            </div>
        </nav>
        
        <!-- 主内容区 -->
        <section class="hero" id="home">
            <div class="hero-content">
                <h1 class="hero-title">Luogu短时比赛，你值得拥有</h1>
                <p class="hero-subtitle">
                    经调研，有许多OIer有着一个问题：无法长时间专注于比赛之上。这堪比21世纪的世纪难题。
                    所以，针对此类问题，我们研制了Luogu短时比赛，提高学习效率！
                </p>
                <a href="#features" class="cta-button">探索更多 <i class="fas fa-arrow-right"></i></a>
            </div>
            <div class="hero-visual">
                <div class="floating-element"></div>
            </div>
        </section>
        
        <!-- 特性展示区 -->
        <section class="features" id="features">
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <h3 class="feature-title">高效性</h3>
                <p class="feature-desc">
                    专注度更高，训练效果成倍提升！
                </p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h3 class="feature-title">全面性</h3>
                <p class="feature-desc">
                    基本收录了洛谷的题目，保证日常刚需！
                </p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h3 class="feature-title">定制性</h3>
                <p class="feature-desc">
                    可自定义难度与算法标签，实现针对性提高！
                </p>
            </div>
        </section>
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>© 2026 What_a_Cat 版权所有 | What?A Cat?</p>
            <p style="margin-top: 10px; font-size: 0.8rem; color: #666;">滚木滚木滚木</p>
        </footer>
    </div>
    
    <!-- 引入粒子库 -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // 初始化粒子背景
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS("particles-js", {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#00c6ff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#0072ff",
                        opacity: 0.2,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" }
                    }
                }
            });
            
            // 创建数据流效果
            const dataStream = document.getElementById('dataStream');
            for (let i = 0; i < 20; i++) {
                const streamLine = document.createElement('div');
                streamLine.className = 'stream-line';
                streamLine.style.left = `${Math.random() * 100}%`;
                streamLine.style.animationDelay = `${Math.random() * 3}s`;
                streamLine.style.animationDuration = `${2 + Math.random() * 2}s`;
                dataStream.appendChild(streamLine);
            }
            
            // 添加滚动动画
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, observerOptions);
            
            // 观察特性卡片
            document.querySelectorAll('.feature-card').forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                observer.observe(card);
            });
        });
    </script>
</body>
</html>
